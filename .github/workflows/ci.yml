name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      cgo_enabled: false
      disable-version-bumping: true

  # Runs the shared dalgotest conformance suite against a real MySQL.
  #
  # This lives here rather than in strongo/cicd on purpose: service containers
  # cannot be passed into a reusable workflow by its caller, and `services:`
  # cannot be made conditional — putting MySQL there would impose a database
  # container on every fleet repo that uses the shared workflow.
  #
  # No test code needed changing: the DB-backed tests already skip unless
  # DALGO2MYSQL_TEST_DSN is set, and TestConformance creates and drops its own
  # table, so a running server and a DSN are the whole requirement.
  integration:
    name: Conformance (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: dalgo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test (with a live MySQL)
        # `go test` prints "ok" for a package whose tests all SKIPPED, so a
        # green job here would not by itself prove the conformance suite ran —
        # which is exactly the vacuously-green outcome this job exists to
        # prevent. Run verbose and assert on the result line.
        run: |
          set -o pipefail
          go test -race -v ./... 2>&1 | tee /tmp/gotest.log
          if grep -qE '^\s*--- SKIP: TestConformance' /tmp/gotest.log; then
            echo "::error::TestConformance SKIPPED - the DSN did not reach the tests"
            exit 1
          fi
          if ! grep -qE '^\s*--- PASS: TestConformance' /tmp/gotest.log; then
            echo "::error::TestConformance did not run"
            exit 1
          fi
        env:
          DALGO2MYSQL_TEST_DSN: root:mysql@tcp(127.0.0.1:3306)/dalgo_test?parseTime=true&multiStatements=true
